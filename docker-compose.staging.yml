name: jkos-staging-bb
services:
  bb-app:
    build:
      context: .
      args:
        VITE_BASE: /beigeboard/
    container_name: staging-bb-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      DB_PATH: /data/beigeBoard.db
      STATIC_DIR: /app/dist
    volumes:
      - ${BEIGEBOARD_DATA_PATH:-/mnt/Luna/Backends-Staging/BeigeBoard-Data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nginx-staging-proxy

networks:
  nginx-staging-proxy:
    external: true
    name: nginx-staging-proxy
