# BeigeBoard — single-container deployment
# TrueNAS SCALE: use Custom App → paste this file
# Local:         docker compose up -d
#
# Data is persisted in the 'bb-data' volume (or bind-mount a host path
# by replacing the volume reference with: ./data:/data)

services:
  beigeboard:
    build: .
    image: beigeboard:latest
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - bb-data:/data
    environment:
      DB_PATH: /data/todos.db
      PORT: 3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/todos',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bb-data:
