# BeigeBoard — standalone deployment
# Serves frontend + API on a single container (port 3001 internal).
# Sits on bb-net; the standalone-nginx container joins this network to proxy
# beigeboard.jkos.net → bb-app:3001.
#
# First run:
#   cp .env.example .env && nano .env   # fill secrets
#   mkdir -p /mnt/Luna/Backends/BeigeBoard-Data
#   docker compose up -d --build

services:
  bb-app:
    build: .
    container_name: bb-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      DB_PATH: /data/beigeBoard.db
      STATIC_DIR: /app/dist
    volumes:
      - ${BEIGEBOARD_DATA_PATH:-/mnt/Luna/Backends/BeigeBoard-Data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bb-net

networks:
  bb-net:
    name: bb-net
