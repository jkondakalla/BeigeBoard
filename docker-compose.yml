services:
  # Standalone mode: full app (frontend + backend) on one port
  beigeBoard:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - bb-data:/data
    environment:
      PORT: 3001
      DB_PATH: /data/beigeBoard.db
    restart: unless-stopped

  # ORDECK mode: API-only on port 8003 (widget is served from ORDECK monorepo)
  beigeboard-api:
    build: ./backend
    ports:
      - "8003:8003"
    volumes:
      - bb-data:/data
    environment:
      - PORT=8003
      - DB_PATH=/data/beigeBoard.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8003/api/auth/google/callback}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI:-http://localhost:8003/api/auth/outlook/callback}
    restart: unless-stopped

volumes:
  bb-data:
